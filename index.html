<script>
let voxBlob=null;
document.getElementById('btnVox').onclick=async()=>{
  let s=await navigator.mediaDevices.getUserMedia({audio:true});
  let mr=new MediaRecorder(s);let ch=[];
  mr.ondataavailable=e=>ch.push(e.data);
  mr.onstop=()=>{voxBlob=new Blob(ch,{type:'audio/webm'});document.getElementById('voxStatus').innerText='¡Vox lista!';document.getElementById('audioVox').src=URL.createObjectURL(voxBlob);document.getElementById('audioVox').style.display='block';};
  mr.start();setTimeout(()=>mr.stop(),5000);document.getElementById('voxStatus').innerText='Grabando 5 seg...';
};
document.getElementById('btnCreate').onclick=async()=>{
  let p=document.getElementById('prompt').value;
  let st=document.getElementById('style').value;
  if(!p)return alert('Escribe tu estilo!');
  let status=document.getElementById('createStatus');
  status.innerText='⏳ Creando música REAL con Suno... espera 30 seg';
  try{
    let res=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:p,style:st,title:p})});
    let data=await res.json();
    console.log(data);
    if(data.error){status.innerText='Error: '+data.error;return;}
    // Suno devuelve audio_url
    let url=data.audio_url || data.data?.audio_url || data.data?.[0]?.audio_url || data.url;
    if(url){
      status.innerText='✅ ¡MÚSICA REAL CREADA!';
      let a=document.getElementById('audioOut');
      a.src=url;a.style.display='block';a.play();
    } else {
      status.innerText='Respuesta: '+JSON.stringify(data).substring(0,200);
    }
  }catch(e){status.innerText='Error conexion: '+e;}
};
                                         </script>
