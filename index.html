<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JCV TRADUCTOR v1.0</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white flex justify-center p-2">
<div class="w-full max-w-[380px]">

<div class="flex flex-col items-center mt-3 mb-3">
  <div class="font-black leading-none tracking-[6px]">
    <div class="grid grid-cols-9 text-center text-[34px] text-blue-600"><span></span><span></span><span></span><span>J</span><span>C</span><span>V</span><span></span><span></span><span></span></div>
    <div class="grid grid-cols-9 text-center text-[21px] text-white mt-1 tracking-[5px]"><span>T</span><span>R</span><span>A</span><span>D</span><span>U</span><span>C</span><span>T</span><span>O</span><span>R</span></div>
  </div>
  <p class="text-[9px] text-zinc-500">v1.0 - Vista como WhatsApp</p>
</div>

<!-- AHORA SI: VISITANTE GRANDE - TU CHICO EN ESQUINA -->
<div class="relative rounded-[22px] overflow-hidden bg-zinc-900 border-2 border-blue-600 h-[420px] bg-black">
  <video id="remote" autoplay playsinline class="w-full h-full object-cover hidden"></video>
  <div id="waiting" class="w-full h-full flex flex-col items-center justify-center p-4 text-center">
    <p class="text-4xl mb-2">👤</p>
    <p class="text-[13px] text-zinc-300 font-bold">Aquí verás al visitante en GRANDE</p>
    <p class="text-[10px] text-zinc-500 mt-1">Cuando alguien entre, su cara aparece aquí</p>
  </div>
  <!-- TU CARA CHICA ABAJO DERECHA COMO WHATSAPP -->
  <video id="me" autoplay muted playsinline class="absolute bottom-3 right-3 w-[110px] h-[150px] rounded-[14px] border-2 border-white object-cover bg-zinc-800 shadow-xl z-10"></video>
  <button id="btnStart" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-blue-600 px-7 py-4 rounded-full font-black text-[13px] z-20">📹 INICIAR MI CÁMARA</button>
  <span class="absolute top-3 left-3 bg-yellow-500 text-black px-2 py-1 rounded-full text-[9px] font-black z-10">LIVE EN + ZH</span>
  <span id="sCam" class="absolute top-3 right-3 bg-zinc-700 px-2 py-1 rounded-full text-[8px] font-bold z-10">CAM OFF</span>
  <span id="labelRemote" class="absolute bottom-3 left-3 bg-blue-600 px-3 py-1 rounded-full text-[11px] font-bold z-10">Visitante - En vivo</span>
</div>

<div class="grid grid-cols-2 gap-2 mt-3">
  <button id="bMic" class="bg-blue-600 rounded-2xl py-4 text-[13px] font-black">🎙️ Mic On</button>
  <button id="bCam" class="bg-blue-600 rounded-2xl py-4 text-[13px] font-black">📹 Cam On</button>
</div>

<button id="bCall" class="w-full bg-blue-600 border-2 border-blue-400 rounded-full py-4 mt-3 font-black text-[15px]">📞 Llamar - 3/3 Gratis</button>

<div class="bg-[#111] rounded-2xl p-3 mt-3 border border-zinc-800"><div id="chat" class="max-h-24 overflow-y-auto text-[11px]"></div><div class="flex gap-2 mt-2"><input id="inp" placeholder="Escribe..." class="flex-1 bg-black border border-blue-500/30 rounded-full px-4 py-3 text-xs"><button id="bSend" class="bg-yellow-400 text-black px-4 py-3 rounded-full text-[11px] font-black">Enviar</button></div></div>

<div class="mt-3 bg-yellow-400 text-black rounded-2xl p-3 text-center">
  <p class="font-black text-[12px]">Premium</p>
  <div class="grid grid-cols-2 gap-2 mt-2">
    <a href="https://www.paypal.com/paypalme/jcvtraductor/10" target="_blank" class="bg-black text-yellow-400 rounded-xl p-2"><p class="font-black text-[16px]">$10 USD</p><p class="text-[9px] text-white">por mes</p></a>
    <a href="https://www.paypal.com/paypalme/jcvtraductor/80" target="_blank" class="bg-black text-yellow-400 rounded-xl p-2 border border-yellow-300"><p class="font-black text-[16px]">$80 USD</p><p class="text-[9px] text-white">por año</p></a>
  </div>
</div>
</div>

<script>
let stream=null, mic=true, cam=true;
const vMe=document.getElementById('me'), btn=document.getElementById('btnStart');

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    vMe.srcObject=stream; btn.classList.add('hidden'); mic=true; cam=true; upd();
  }catch(e){ alert("Toca el 🔒 arriba > Permitir cámara y mic"); }
}
function upd(){
  document.getElementById('bMic').innerText=mic?"🎙️ Mic On":"🔇 Mic Off";
  document.getElementById('bCam').innerText=cam?"📹 Cam On":"📹 Cam Off";
  document.getElementById('sCam').innerText=cam?"CAM ON":"CAM OFF"; document.getElementById('sCam').style.background=cam?"#16a34a":"#dc2626";
  vMe.style.display=cam?"block":"none";
  document.getElementById('bMic').className=mic?"bg-blue-600 rounded-2xl py-4 text-[13px] font-black":"bg-zinc-700 rounded-2xl py-4 text-[13px] font-black text-zinc-400";
  document.getElementById('bCam').className=cam?"bg-blue-600 rounded-2xl py-4 text-[13px] font-black":"bg-zinc-700 rounded-2xl py-4 text-[13px] font-black text-zinc-400";
}
btn.addEventListener('click', start);
document.getElementById('bMic').addEventListener('click', ()=>{ if(!stream){ start(); return; } mic=!mic; stream.getAudioTracks().forEach(t=>t.enabled=mic); upd(); });
document.getElementById('bCam').addEventListener('click', ()=>{ if(!stream){ start(); return; } cam=!cam; stream.getVideoTracks().forEach(t=>t.enabled=cam); upd(); if(!cam) btn.classList.remove('hidden'); });
let c=3; document.getElementById('bCall').addEventListener('click', function(){ if(c<=0){ alert("Paga $10 USD"); return; } c--; this.innerText="📞 Llamar - "+c+"/3 Gratis"; });
</script></body></html>
