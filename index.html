<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JCV IMPERIO REAL</title>
    <style>
        body { background: #000; color: #FFD700; font-family: sans-serif; text-align: center; padding: 20px; }
        h1 { font-size: 26px; text-shadow: 0 0 10px gold; }
        textarea, input { width: 95%; border-radius: 10px; padding: 10px; margin: 10px 0; border: 1px solid #FFD700; background: #111; color: #fff; }
        button { background: linear-gradient(45deg, #FFD700, #FFA500); border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin: 10px 5px; color: #000; }
        button:hover { opacity: 0.9; }
        #status { margin: 20px; color: #fff; font-size: 18px; font-weight: bold; }
        audio { width: 95%; margin: 20px 0; }
    </style>
</head>
<body>

    <h1>👑 JCV IMPERIO v2.0 REAL 🔥</h1>
    <p>Arrieros Somos</p>

    <textarea id="prompt" placeholder="Escribe tu letra o idea aquí..." rows="4"></textarea>
    <input id="style" type="text" value="Mexican Regional, Corrido" placeholder="Estilo musical...">
    
    <br>
    <button id="btnCreate">🔥 CREAR MÚSICA REAL 🎸</button>
    <button id="btnVox">🎤 Grabar Voz (5s)</button>

    <div id="status">Listo para crear hit REAL</div>
    <audio id="audioPlayer" controls style="display:none;"></audio>
    <div id="extra"></div>

    <script>
        let voxBlob = null;

        // Sistema de grabación de voz (Tu lógica original optimizada)
        document.getElementById('btnVox').onclick = async () => {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "🎤 Grabando voz (5 segundos)...";
            try {
                let s = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mr = new MediaRecorder(s);
                let ch = [];
                mr.ondataavailable = e => ch.push(e.data);
                mr.onstop = () => {
                    voxBlob = new Blob(ch, { type: 'audio/webm' });
                    statusDiv.innerText = "✅ Voz grabada y lista.";
                };
                mr.start();
                setTimeout(() => mr.stop(), 5000);
            } catch (err) {
                statusDiv.innerText = "❌ Error al acceder al micrófono.";
                console.error(err);
            }
        };

        // Petición al Backend en Vercel
        document.getElementById('btnCreate').onclick = async () => {
            const promptValue = document.getElementById('prompt').value;
            const styleValue = document.getElementById('style').value;
            const statusDiv = document.getElementById('status');
            const player = document.getElementById('audioPlayer');

            if (!promptValue.trim()) {
                statusDiv.innerText = "⚠️ Por favor, escribe una letra o idea.";
                return;
            }

            statusDiv.innerText = "⚡ Conectando con el servidor backend...";

            try {
                // Apunta exactamente al archivo generate.py dentro de /api
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: promptValue,
                        tags: styleValue
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerText = "🎵 ¡Música generada exitosamente!";
                    // Ajusta 'audio_url' según los parámetros exactos que devuelva tu Gateway de Suno
                    if (data.audio_url || (data.clips && data.clips[0].audio_url)) {
                        player.src = data.audio_url || data.clips[0].audio_url;
                        player.style.display = "block";
                        player.play();
                    } else {
                        statusDiv.innerText = "✅ Procesado, pero no se encontró URL directa de audio en la respuesta.";
                    }
                } else {
                    // Muestra el error exacto que devuelva el script de Python
                    statusDiv.innerText = `❌ Error: ${data.error || 'No se pudo conectar con Suno'}`;
                }
            } catch (error) {
                statusDiv.innerText = "❌ Error crítico de red o el servidor falló.";
                console.error(error);
            }
        };
    </script>
</body>
</html>
