<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRI v1.3 PRO</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white min-h-screen flex flex-col items-center p-4">
<h1 class="text-4xl font-black bg-gradient-to-r from-purple-500 to-cyan-400 bg-clip-text text-transparent">JCV-AI</h1><p class="text-yellow-300 text-xs tracking-[0.3em]">TRI TRANSLATOR v1.3 PRO</p>
<div class="w-full max-w-sm border-4 border-yellow-400 rounded-[32px] p-4 bg-zinc-900/80 mt-3">
<div class="flex gap-2"><button id="b-es" class="flex-1 py-2 rounded-2xl font-black bg-white text-black">ES</button><button id="b-en" class="flex-1 py-2 rounded-2xl bg-zinc-800">EN</button><button id="b-zh" class="flex-1 py-2 rounded-2xl bg-zinc-800">中</button></div>
<textarea id="input" placeholder="Escribe..." class="w-full mt-3 bg-black border border-zinc-700 rounded-2xl p-3 h-20"></textarea>
<div id="output" class="w-full mt-2 bg-zinc-800 rounded-2xl p-3 min-h-[50px] text-cyan-200 text-sm">Traducción...</div>
<button onclick="doTRI()" class="w-full mt-3 bg-gradient-to-r from-purple-600 to-cyan-400 py-3 rounded-full font-black">TRADUCIR Y HABLAR</button>

<div class="mt-4 border-t border-zinc-700 pt-3">
<button id="btnVideo" onclick="videoCall()" class="w-full bg-yellow-400 text-black py-3 rounded-full font-black">VIDEO LLAMADA TRI</button>
<div id="vbox" class="hidden mt-3">
<video id="vid" autoplay muted playsinline class="w-full rounded-2xl bg-black h-56"></video>
<div id="sub" class="mt-2 text-xs text-yellow-200 bg-black/60 p-2 rounded">Subtitulos traducidos aquí...</div>
<div class="grid grid-cols-3 gap-2 mt-2">
<button onclick="toggleMic()" id="micBtn" class="bg-zinc-800 py-2 rounded-full text-xs">🎤 MIC ON</button>
<button onclick="toggleCam()" id="camBtn" class="bg-zinc-800 py-2 rounded-full text-xs">📷 CAM ON</button>
<button onclick="hangup()" class="bg-red-600 py-2 rounded-full text-xs font-black">❌ COLGAR</button>
</div>
<button onclick="startLiveTranslate()" class="w-full mt-2 bg-purple-600 py-2 rounded-full text-xs">🔴 TRADUCIR MI VOZ EN VIVO</button>
</div>
</div>

<div class="mt-4 bg-gradient-to-r from-yellow-600 to-yellow-300 text-black rounded-2xl p-3 text-center">
<p class="font-black text-xs">💰 MONETIZA TU TRI</p>
<a href="https://paypal.me/" target="_blank" class="block mt-1 bg-black text-yellow-400 py-2 rounded-full text-xs font-bold">DONAR VIA PAYPAL</a>
<p class="text-[9px] mt-1">Pon tu link de PayPal / Stripe aquí - 5 USD por llamada premium</p>
</div>
</div>
<script>
let lang='es',stream=null,micOn=true,camOn=true,recog=null;
const upd=()=>{['es','en','zh'].forEach(l=>document.getElementById('b-'+l).className='flex-1 py-2 rounded-2xl bg-zinc-800');document.getElementById('b-'+lang).className='flex-1 py-2 rounded-2xl font-black bg-white text-black';};
document.getElementById('b-es').onclick=()=>{lang='es';upd()};document.getElementById('b-en').onclick=()=>{lang='en';upd()};document.getElementById('b-zh').onclick=()=>{lang='zh';upd()};
async function translateAuto(text,target){let tl=target=='zh'?'zh-CN':target;let r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${tl}&dt=t&q=${encodeURIComponent(text)}`);let j=await r.json();return j[0].map(x=>x[0]).join('');}
async function doTRI(){let t=document.getElementById('input').value.trim();if(!t)return;document.getElementById('output').innerText='...';let trad=await translateAuto(t,lang);document.getElementById('output').innerText=trad;let u=new SpeechSynthesisUtterance(trad);u.lang=lang=='zh'?'zh-CN':lang=='en'?'en-US':'es-MX';speechSynthesis.speak(u);}
async function videoCall(){document.getElementById('vbox').classList.remove('hidden');document.getElementById('btnVideo').innerText='EN LLAMADA...';try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('vid').srcObject=stream;}catch(e){alert('Permite cam y mic')}}
function hangup(){if(stream){stream.getTracks().forEach(t=>t.stop());}document.getElementById('vbox').classList.add('hidden');document.getElementById('btnVideo').innerText='VIDEO LLAMADA TRI';if(recog)recog.stop();document.getElementById('vid').srcObject=null;}
function toggleMic(){if(!stream)return;micOn=!micOn;stream.getAudioTracks().forEach(t=>t.enabled=micOn);document.getElementById('micBtn').innerText=micOn?'🎤 MIC ON':'🔇 MIC OFF';}
function toggleCam(){if(!stream)return;camOn=!camOn;stream.getVideoTracks().forEach(t=>t.enabled=camOn);document.getElementById('camBtn').innerText=camOn?'📷 CAM ON':'📷 CAM OFF';}
function startLiveTranslate(){
let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Usa Chrome');return;}
recog=new SR();recog.lang=lang=='en'?'en-US':lang=='zh'?'zh-CN':'es-MX';recog.continuous=true;recog.interimResults=false;
recog.onresult=async e=>{let txt=e.results[e.results.length-1][0].transcript;document.getElementById('sub').innerText='Dijiste: '+txt;let target=lang=='es'?'en':lang=='en'?'es':'en';let trad=await translateAuto(txt,target);document.getElementById('sub').innerText='TRI: '+trad;let u=new SpeechSynthesisUtterance(trad);u.lang=target=='zh'?'zh-CN':target=='en'?'en-US':'es-MX';speechSynthesis.speak(u);};
recog.start();document.getElementById('sub').innerText='Escuchando... habla ahora';}
</script></body></html>
