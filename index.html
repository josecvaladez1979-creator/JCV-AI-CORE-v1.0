<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JCV TRADUCTOR v1.0</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white flex justify-center p-2">
<div class="w-full max-w-[380px]">

<div class="flex flex-col items-center mt-2 mb-2">
  <div class="font-black leading-none tracking-[6px]">
    <div class="grid grid-cols-9 text-center text-[30px] text-blue-600"><span></span><span></span><span></span><span>J</span><span>C</span><span>V</span><span></span><span></span><span></span></div>
    <div class="grid grid-cols-9 text-center text-[19px] text-white mt-1 tracking-[4px]"><span>T</span><span>R</span><span>A</span><span>D</span><span>U</span><span>C</span><span>T</span><span>O</span><span>R</span></div>
  </div>
  <p class="text-[9px] text-zinc-500">v1.0 - ESTABLE</p>
</div>

<div class="relative rounded-[22px] overflow-hidden bg-zinc-900 border-2 border-blue-600 h-[340px]">
  <video id="me" autoplay muted playsinline class="w-full h-full object-cover bg-black"></video>
  <div id="off" class="hidden absolute inset-0 bg-zinc-900 flex items-center justify-center"><p class="text-zinc-500 text-[12px]">Cámara apagada</p></div>
  <span class="absolute bottom-3 left-3 bg-blue-600 px-3 py-1 rounded-full text-[11px] font-bold">Tú - En vivo</span>
  <span id="sCam" class="absolute top-3 left-3 bg-zinc-700 px-2 py-1 rounded-full text-[9px] font-bold">CAM OFF</span>
  <span id="sMic" class="absolute top-3 right-3 bg-zinc-700 px-2 py-1 rounded-full text-[9px] font-bold">MIC OFF</span>
  <button id="btnStart" class="absolute inset-0 m-auto w-[200px] h-[50px] bg-blue-600 rounded-full font-black text-[13px] shadow-xl">📹 TOCA PARA INICIAR</button>
</div>

<div class="grid grid-cols-2 gap-2 mt-2">
  <button id="bMic" class="bg-blue-600 rounded-2xl py-3 text-[12px] font-black">🎙️ Mic On</button>
  <button id="bCam" class="bg-blue-600 rounded-2xl py-3 text-[12px] font-black">📹 Cam On</button>
</div>

<button id="bCall" class="w-full bg-blue-600 border-2 border-blue-400 rounded-full py-3 mt-2 font-black text-[14px]">📞 Llamar - 3/3 Gratis</button>

<div class="mt-2 bg-[#111] rounded-2xl p-2 border border-zinc-800">
  <div id="chat" class="max-h-[150px] overflow-y-auto space-y-2 text-[11px] p-1"></div>
  <div class="flex gap-2 mt-2">
    <input id="inp" placeholder="Escribe para traducir a EN + 中文" class="flex-1 bg-black border border-blue-500/30 rounded-full px-4 py-3 text-[11px] outline-none">
    <button id="bSend" class="bg-yellow-400 text-black px-5 rounded-full font-black text-[11px]">Enviar</button>
  </div>
  <p class="text-[8px] text-zinc-500 mt-1 text-center">Traduce automático + voz</p>
</div>

<div class="mt-3 bg-yellow-400 text-black rounded-2xl p-3 text-center">
  <p class="font-black text-[12px]">Premium Sin Anuncios</p>
  <div class="grid grid-cols-2 gap-2 mt-2">
    <a href="https://www.paypal.com/paypalme/jcvtraductor/10" target="_blank" class="bg-black text-yellow-400 rounded-xl p-2"><p class="font-black text-[16px]">$10 USD</p><p class="text-[9px] text-white">por mes</p></a>
    <a href="https://www.paypal.com/paypalme/jcvtraductor/80" target="_blank" class="bg-black text-yellow-400 rounded-xl p-2 border border-yellow-300"><p class="font-black text-[16px]">$80 USD</p><p class="text-[9px] text-white">por año - Ahorra 33%</p></a>
  </div>
</div>
</div>

<script>
let stream=null, mic=true, cam=true;
const v=document.getElementById('me'), btn=document.getElementById('btnStart'), off=document.getElementById('off'), chat=document.getElementById('chat');

async function start(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:true, audio:true});
    v.srcObject=stream; btn.classList.add('hidden'); off.classList.add('hidden'); mic=true; cam=true; upd();
  }catch(e){ alert("Permite cámara y mic en el 🔒 de arriba"); }
}
function upd(){
  document.getElementById('bMic').innerText=mic?"🎙️ Mic On":"🔇 Mic Off";
  document.getElementById('bCam').innerText=cam?"📹 Cam On":"📹 Cam Off";
  document.getElementById('sMic').innerText=mic?"MIC ON":"MIC OFF"; document.getElementById('sMic').style.background=mic?"#16a34a":"#dc2626";
  document.getElementById('sCam').innerText=cam?"CAM ON":"CAM OFF"; document.getElementById('sCam').style.background=cam?"#16a34a":"#dc2626";
  v.style.display=cam?"block":"none"; off.classList.toggle('hidden', cam);
  document.getElementById('bMic').className=mic?"bg-blue-600 rounded-2xl py-3 text-[12px] font-black":"bg-zinc-700 rounded-2xl py-3 text-[12px] font-black text-zinc-400";
  document.getElementById('bCam').className=cam?"bg-blue-600 rounded-2xl py-3 text-[12px] font-black":"bg-zinc-700 rounded-2xl py-3 text-[12px] font-black text-zinc-400";
}
btn.addEventListener('click', start);
document.getElementById('bMic').addEventListener('click', ()=>{ if(!stream){ start(); return; } mic=!mic; stream.getAudioTracks().forEach(t=>t.enabled=mic); upd(); });
document.getElementById('bCam').addEventListener('click', ()=>{ if(!stream){ start(); return; } cam=!cam; stream.getVideoTracks().forEach(t=>t.enabled=cam); upd(); });

// TRADUCCION QUE SI JALABA
async function trad(t, to){ try{ const r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=es|${to}`); const d=await r.json(); return d.responseData.translatedText; }catch{ return t; } }
function speak(t, lang){ const u=new SpeechSynthesisUtterance(t); u.lang=lang; u.rate=0.9; speechSynthesis.speak(u); }

async function sendMsg(){
  const inp=document.getElementById('inp'); const txt=inp.value.trim(); if(!txt) return;
  inp.value="";
  chat.innerHTML+=`<div class="bg-blue-600/20 border border-blue-500/30 rounded-xl p-2"><b>Tú:</b> ${txt}</div>`;
  const en=await trad(txt,'en'); const zh=await trad(txt,'zh');
  chat.innerHTML+=`<div class="bg-zinc-800 rounded-xl p-2"><b>EN:</b> ${en}<br><b>中文:</b> ${zh}</div>`;
  chat.scrollTop=chat.scrollHeight;
  speak(en,'en-US'); setTimeout(()=>speak(zh,'zh-CN'), 1200);
}
document.getElementById('bSend').addEventListener('click', sendMsg);
document.getElementById('inp').addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });

let c=3; document.getElementById('bCall').addEventListener('click', function(){ if(c<=0){ alert("Se acabaron. Premium $10 USD"); return; } c--; this.innerText="📞 Llamar - "+c+"/3 Gratis"; });
</script></body></html>
