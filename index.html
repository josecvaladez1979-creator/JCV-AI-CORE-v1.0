<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCV TRADUCTOR V2.4 FINAL</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui}.on-red{background:#dc2626!important}.on-blue{background:#2563eb!important}.off{background:#27272a!important;color:#6b7280!important}</style>
</head>
<body class="bg-black flex justify-center p-2 min-h-screen">
<div class="w-full max-w-[400px]">

<div class="flex items-center gap-2 px-2 py-1"><div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div><p id="estadoConn" class="text-[11px] text-zinc-300 tracking-wider">EN LÍNEA - Registra tu número</p></div>

<div class="rounded-[20px] border-2 border-blue-600 h-[380px] mt-2 relative bg-zinc-900 overflow-hidden">
<video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
<video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden bg-black"></video>
<div id="overlay" class="absolute inset-0 bg-zinc-900 flex flex-col items-center justify-center gap-3">
<button id="btnIniciar" class="bg-blue-600 rounded-full px-8 py-4 font-black text-[14px]">📷 INICIAR CÁMARA</button>
<p class="text-[11px] text-zinc-500">Usa WiFi para que no se trabe</p>
<div class="flex items-center gap-2 mt-2"><span class="text-[10px] text-zinc-400">Vol. local</span><input id="volLocal" type="range" min="0" max="100" value="70" class="w-20 accent-blue-600"><span class="text-[10px] text-zinc-400">Vol. remoto</span><input id="volRemoto" type="range" min="0" max="100" value="90" class="w-20 accent-blue-600"></div>
<p id="status" class="text-[10px] text-zinc-500 mt-1"></p>
</div>
<div class="absolute bottom-2 left-2 bg-blue-600 text-[10px] px-2 py-1 rounded-full" id="myLabel">Tú</div>
<div class="absolute bottom-2 right-2 bg-zinc-800 text-[10px] px-2 py-1 rounded-full" id="remoteLabel">Sin conectar</div>
</div>

<div class="mt-3 flex gap-2"><input id="myPhone" type="tel" placeholder="Tu celular 10 dígitos" class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-3 text-[14px] outline-none focus:border-blue-600"><button id="btnRegistrar" class="bg-blue-600 rounded-full px-6 font-black text-[12px]">OK</button></div>
<div class="mt-2 flex gap-2"><input id="peerPhone" type="tel" placeholder="Celular a llamar" class="flex-1 bg-black border border-green-600/60 rounded-full px-4 py-3 text-[14px] outline-none"><button id="btnLlamar" class="bg-green-600 rounded-full px-6 py-3 font-black text-[13px]">LLAMAR</button></div>

<div class="mt-2 flex gap-2"><select id="langSelect" class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-3 text-[13px] outline-none"><option value="zh-CN">🇨🇳 Chino</option><option value="en-US">🇺🇸 Inglés</option><option value="es-MX">🇪🇸 Español</option><option value="pt-BR">🇧🇷 Portugués</option><option value="fr-FR">🇫🇷 Francés</option><option value="ja-JP">🇯🇵 Japonés</option></select>
<label class="flex items-center gap-1 bg-zinc-900 border border-zinc-800 rounded-full px-3 text-[11px]"><input id="checkTrad" type="checkbox" checked class="accent-blue-600"> Traducir en llamada</label></div>

<div class="mt-3 grid grid-cols-2 gap-2">
<button id="btnEsMundo" class="on-red rounded-full py-3.5 text-[12px] font-black">ES → MUNDO ON</button>
<button id="btnMundoEs" class="off rounded-full py-3.5 text-[12px] font-black">MUNDO → ES OFF</button>
</div>

<button id="btnHablar" class="mt-3 w-full bg-blue-600 active:bg-blue-700 rounded-full py-4 font-black text-[13px] select-none">🎙️ MANTÉN PRESIONADO PARA TRADUCIR</button>

<div class="mt-3 flex gap-2"><input id="textInput" type="text" placeholder="Escribe y traduce" class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-3 text-[14px] outline-none"><button id="btnEnviar" class="bg-yellow-400 text-black font-black rounded-full px-6 text-[13px]">Enviar</button></div>

<div class="mt-3 bg-zinc-900/80 rounded-xl p-3 min-h-[56px]"><p id="resultado" class="text-[13px] text-yellow-400 leading-tight">Listo para traducir...</p><p id="resultado2" class="text-[10px] text-zinc-500 mt-1"></p></div>
<p id="trialText" class="text-center text-[10px] text-zinc-600 mt-2">Prueba 7 días gratis. Después $10 USD/mes o $90 USD/año</p>

<div id="modalPhone" class="fixed inset-0 bg-black/95 z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-700 rounded-[20px] p-5 w-full max-w-[330px] text-center"><h2 class="font-black text-[16px]">Registra tu número</h2><p class="text-[11px] text-zinc-400 mt-1">Con este número te van a llamar</p><input id="firstPhone" type="tel" placeholder="Ej: 7772509241" class="w-full mt-4 bg-black border border-blue-600 rounded-full px-4 py-3 text-center text-[18px] tracking-widest"><button id="btnGuardarPrimero" class="mt-4 w-full bg-blue-600 rounded-full py-3.5 font-black">GUARDAR Y ENTRAR</button></div></div>

<div id="paywall" class="hidden fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 w-full max-w-[340px] text-center"><h2 class="font-black">Prueba terminada</h2><p class="text-[12px] text-zinc-400 mt-2">Actualiza a Premium</p><button onclick="localStorage.setItem('jcv_premium','si');document.getElementById('paywall').classList.add('hidden')" class="mt-4 w-full bg-blue-600 rounded-full py-3 font-black">$10/MES</button><button onclick="localStorage.setItem('jcv_premium','si');document.getElementById('paywall').classList.add('hidden')" class="mt-2 w-full bg-white text-black rounded-full py-3 font-black">$90/AÑO</button></div></div>

</div>
<script>
// ===== CONFIG FINAL VERIFICADA =====
let direccion='es-mundo', peer=null, localStream=null, dataConn=null;
const estadoConn=document.getElementById('estadoConn'), statusTxt=document.getElementById('status');
const btnEs=document.getElementById('btnEsMundo'), btnMundo=document.getElementById('btnMundoEs');
function setEs(){ direccion='es-mundo'; btnEs.className='on-red rounded-full py-3.5 text-[12px] font-black'; btnMundo.className='off rounded-full py-3.5 text-[12px] font-black'; btnEs.innerText='ES → MUNDO ON'; btnMundo.innerText='MUNDO → ES OFF'; }
function setMundo(){ direccion='mundo-es'; btnMundo.className='on-blue rounded-full py-3.5 text-[12px] font-black'; btnEs.className='off rounded-full py-3.5 text-[12px] font-black'; btnMundo.innerText='MUNDO → ES ON'; btnEs.innerText='ES → MUNDO OFF'; }
btnEs.onclick=setEs; btnMundo.onclick=setMundo;

function limpiar(n){ return n.replace(/\D/g,''); }
function conectarPeer(num){
  if(peer) try{peer.destroy();}catch(e){}
  peer=new Peer('jcv-'+num,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'turn:openrelay.metered.ca:80',username:'openrelayproject',credential:'openrelayproject'}]}});
  peer.on('open',()=>{ estadoConn.innerText='🟢 EN LÍNEA '+num+' - Con WiFi va fluido'; statusTxt.innerText='En línea. Listo para llamar'; document.getElementById('myLabel').innerText='Tú: '+num.slice(-4); });
  peer.on('connection',c=>{ dataConn=c; c.on('data',d=>{ document.getElementById('resultado').innerText=d.trad; document.getElementById('resultado2').innerText='Te dicen: '+d.original; if(document.getElementById('checkTrad').checked) hablar(d.trad); }); });
  peer.on('call',async call=>{
    estadoConn.innerText='📞 ENTRANTE DE '+call.peer.replace('jcv-',''); const s=await initMedia(); call.answer(s);
    call.on('stream',rs=>{ const rv=document.getElementById('remoteVideo'); rv.srcObject=rs; rv.volume=document.getElementById('volRemoto').value/100; rv.classList.remove('hidden'); document.getElementById('remoteLabel').innerText=call.peer.replace('jcv-',''); estadoConn.innerText='🟢 EN LLAMADA CON '+call.peer.replace('jcv-',''); });
  });
  peer.on('error',e=>{ if(e.type==='peer-unavailable'){ alert('El número no está en línea. Dile al otro que abra la app y presione INICIAR CÁMARA.'); estadoConn.innerText='🔴 NÚMERO NO DISPONIBLE'; } });
}
async function initMedia(){
  if(!localStream){
    localStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480},frameRate:{ideal:15}},audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    document.getElementById('localVideo').srcObject=localStream; document.getElementById('overlay').classList.add('hidden');
  } return localStream;
}
function guardarNumero(raw){
  const num=limpiar(raw); if(num.length<10){ alert('Escribe 10 dígitos'); return; }
  localStorage.setItem('jcv_phone',num); document.getElementById('myPhone').value=num; document.getElementById('modalPhone').classList.add('hidden'); conectarPeer(num);
}
document.getElementById('btnGuardarPrimero').onclick=()=>guardarNumero(document.getElementById('firstPhone').value);
document.getElementById('btnRegistrar').onclick=()=>guardarNumero(document.getElementById('myPhone').value);
document.getElementById('btnIniciar').onclick=async()=>{ try{ await initMedia(); const n=localStorage.getItem('jcv_phone'); if(n&&!peer) conectarPeer(n); }catch(e){ alert('Permite cámara y micro'); } };
document.getElementById('volRemoto').oninput=e=>{ const rv=document.getElementById('remoteVideo'); if(rv) rv.volume=e.target.value/100; };
document.getElementById('volLocal').oninput=e=>{ const lv=document.getElementById('localVideo'); if(lv) lv.volume=e.target.value/100; };
document.getElementById('btnLlamar').onclick=async()=>{
  const to=limpiar(document.getElementById('peerPhone').value); if(!to){ alert('Pon el número a llamar'); return; }
  const me=localStorage.getItem('jcv_phone'); if(!me){ alert('Registra tu número primero'); return; }
  if(!localStream) await initMedia(); if(!peer){ conectarPeer(me); await new Promise(r=>setTimeout(r,1000)); }
  estadoConn.innerText='📞 LLAMANDO A '+to+'...'; dataConn=peer.connect('jcv-'+to);
  const call=peer.call('jcv-'+to,localStream);
  call.on('stream',rs=>{ const rv=document.getElementById('remoteVideo'); rv.srcObject=rs; rv.volume=document.getElementById('volRemoto').value/100; rv.classList.remove('hidden'); estadoConn.innerText='🟢 CONECTADO CON '+to; document.getElementById('remoteLabel').innerText=to; });
  setTimeout(()=>{ const rv=document.getElementById('remoteVideo'); if(!rv.srcObject){ alert('No contesta. Asegúrate que el otro también le dio a INICIAR CÁMARA y está en WiFi.'); estadoConn.innerText='🔴 SIN RESPUESTA'; } },6000);
};

// TRADUCCION VERIFICADA
async function traducir(texto){
  let sl=direccion==='es-mundo'?'es':document.getElementById('langSelect').value.split('-')[0];
  let tl=direccion==='es-mundo'?document.getElementById('langSelect').value.split('-')[0]:'es';
  try{
    const r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(texto)}`);
    const d=await r.json(); return d[0].map(x=>x[0]).join('');
  }catch(e){ return texto; }
}
function hablar(texto){ const lang=document.getElementById('langSelect').value; const voz=direccion==='es-mundo'?lang:'es-MX'; const u=new SpeechSynthesisUtterance(texto); u.lang=voz; u.rate=0.95; speechSynthesis.speak(u); }

// VOZ Y TEXTO
let rec=null; const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(SR){ rec=new SR(); rec.continuous=false; rec.interimResults=false; }
const btnHablar=document.getElementById('btnHablar');
if(rec){
  const startRec=()=>{ try{ rec.lang=direccion==='es-mundo'?'es-MX':document.getElementById('langSelect').value; rec.start(); btnHablar.innerText='🔴 ESCUCHANDO... SUELTA'; }catch(e){} };
  const stopRec=()=>{ try{ rec.stop(); }catch(e){} btnHablar.innerText='🎙️ MANTÉN PRESIONADO PARA TRADUCIR'; };
  btnHablar.addEventListener('touchstart',e=>{ e.preventDefault(); startRec(); }); btnHablar.addEventListener('touchend',e=>{ e.preventDefault(); stopRec(); });
  btnHablar.addEventListener('mousedown',startRec); btnHablar.addEventListener('mouseup',stopRec); btnHablar.addEventListener('mouseleave',stopRec);
  rec.onresult=async e=>{ const txt=e.results[0][0].transcript; document.getElementById('resultado').innerText='Traduciendo: '+txt; const tr=await traducir(txt); document.getElementById('resultado').innerText=tr; document.getElementById('resultado2').innerText='Dijiste: '+txt; hablar(tr); if(dataConn&&dataConn.open) dataConn.send({original:txt,trad:tr}); };
  rec.onerror=()=>{ btnHablar.innerText='🎙️ MANTÉN PRESIONADO PARA TRADUCIR'; };
}else{ btnHablar.innerText='USA CHROME PARA VOZ'; }

document.getElementById('btnEnviar').onclick=async()=>{
  const t=document.getElementById('textInput').value.trim(); if(!t) return;
  document.getElementById('resultado').innerText='Traduciendo...'; const tr=await traducir(t);
  document.getElementById('resultado').innerText=tr; document.getElementById('resultado2').innerText='Original: '+t; hablar(tr);
  if(dataConn&&dataConn.open) dataConn.send({original:t,trad:tr}); document.getElementById('textInput').value='';
};

// INIT
const saved=localStorage.getItem('jcv_phone'); if(saved){ document.getElementById('myPhone').value=saved; document.getElementById('firstPhone').value=saved; document.getElementById('modalPhone').classList.add('hidden'); conectarPeer(saved); estadoConn.innerText='🟢 EN LÍNEA '+saved+' - Con WiFi va fluido'; }
let inicio=localStorage.getItem('jcv_inicio'); if(!inicio){ inicio=Date.now(); localStorage.setItem('jcv_inicio',inicio); }
(function check(){ const dias=(Date.now()-parseInt(inicio))/(1000*60*60*24); const rest=Math.max(0,7-Math.floor(dias)); if(rest>0) document.getElementById('trialText').innerText=`Te quedan ${rest} días gratis. Después $10 USD/mes o $90 USD/año`; if(dias>7&&localStorage.getItem('jcv_premium')!=='si') document.getElementById('paywall').classList.remove('hidden'); })();
</script>
</body>
</html>
