<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JCV TRI v2.0 FIX</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/peerjs@1.5.0/dist/peerjs.min.js"></script></head>
<body class="bg-black text-white min-h-screen flex flex-col items-center p-4">
<h1 class="text-3xl font-black text-yellow-400">JCV TRI v2.0 FIX</h1><p class="text-[9px] text-green-400">ARREGLADO - HABLA Y TRADUCE</p>
<div class="w-full max-w-sm border-4 border-yellow-400 rounded-[32px] p-4 bg-zinc-900 mt-3">
<p id="myId" class="text-center font-mono text-yellow-300 text-sm">Cargando ID...</p>
<div class="flex gap-2 mt-2"><input id="peerId" placeholder="ID otro" class="flex-1 bg-zinc-800 rounded-full px-3 text-xs py-2"><button onclick="callPeer()" class="bg-yellow-400 text-black px-4 py-2 rounded-full font-black text-xs">LLAMAR</button></div>
<div class="flex gap-2 mt-3"><button id="b-es" class="flex-1 py-2 rounded-xl bg-white text-black font-black text-xs">ESPAÑOL</button><button id="b-en" class="flex-1 py-2 rounded-xl bg-zinc-800 text-xs">ENGLISH</button><button id="b-zh" class="flex-1 py-2 rounded-xl bg-zinc-800 text-xs">中文</button></div>
<div class="relative mt-3"><video id="remoteVid" autoplay playsinline class="w-full rounded-2xl bg-black h-56"></video><video id="localVid" autoplay muted playsinline class="w-20 h-20 rounded-xl bg-zinc-800 absolute bottom-2 right-2 border-2 border-yellow-400"></video></div>
<div id="subBox" class="mt-2 bg-black p-2 rounded-xl text-xs text-yellow-200 min-h-[50px]">1- Elige ESPAÑOL si vas a hablar español<br>2- Pica el botón verde<br>3- Habla</div>
<button id="autoBtn" onclick="activateOnce()" class="w-full mt-2 bg-green-500 py-3 rounded-full text-xs font-black">🟢 PICA AQUÍ Y HABLA - 1 SOLO CLICK</button>
<div class="grid grid-cols-3 gap-2 mt-2"><button onclick="toggleMic()" id="micBtn" class="bg-zinc-800 py-2 rounded-full text-[10px]">🎤 MIC ON</button><button onclick="toggleCam()" id="camBtn" class="bg-zinc-800 py-2 rounded-full text-[10px]">📷 CAM ON</button><button onclick="hangup()" class="bg-red-600 py-2 rounded-full text-[10px] font-black">COLGAR</button></div>
</div>
<script>
let lang='es', localStream=null, peer=null, currentCall=null, micOn=true, camOn=true, recog=null, autoActive=false;
const myIdEl=document.getElementById('myId'), localVid=document.getElementById('localVid'), remoteVid=document.getElementById('remoteVid'), autoBtn=document.getElementById('autoBtn'), subBox=document.getElementById('subBox');
function upd(){['es','en','zh'].forEach(l=>{document.getElementById('b-'+l).className='flex-1 py-2 rounded-xl bg-zinc-800 text-xs';});document.getElementById('b-'+lang).className='flex-1 py-2 rounded-xl bg-white text-black font-black text-xs'; if(recog){recog.onend=null; recog.stop(); if(autoActive) setTimeout(startLiveTRI,500);}}
document.getElementById('b-es').onclick=()=>{lang='es';upd();};document.getElementById('b-en').onclick=()=>{lang='en';upd();};document.getElementById('b-zh').onclick=()=>{lang='zh';upd();};
async function translateAuto(t,tl){let to=tl=='zh'?'zh-CN':tl;try{let r=await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${to}&dt=t&q=${encodeURIComponent(t)}`);let j=await r.json();return j[0].map(x=>x[0]).join('');}catch(e){return 'Error trad: '+t;}}
async function init(){try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});localVid.srcObject=localStream;peer=new Peer('JCV-TRI-'+Math.floor(Math.random()*9000+1000));peer.on('open', id=>{myIdEl.innerText='TU ID: '+id;});peer.on('call', call=>{currentCall=call;call.answer(localStream);call.on('stream', s=>{remoteVid.srcObject=s;});});}catch(e){subBox.innerText='Permite cámara y mic: '+e.message;}}
async function callPeer(){let id=document.getElementById('peerId').value.trim();if(!id)return alert('Pega ID');let call=peer.call(id, localStream);currentCall=call;call.on('stream', s=>{remoteVid.srcObject=s;});}
function hangup(){if(currentCall)currentCall.close();remoteVid.srcObject=null;if(recog){recog.onend=null;recog.stop();recog=null;}autoActive=false;autoBtn.innerText='🟢 PICA AQUÍ Y HABLA - 1 SOLO CLICK';autoBtn.className='w-full mt-2 bg-green-500 py-3 rounded-full text-xs font-black';subBox.innerText='Colgado - traducción apagada';}
function toggleMic(){micOn=!micOn;localStream.getAudioTracks().forEach(t=>t.enabled=micOn);document.getElementById('micBtn').innerText=micOn?'🎤 MIC ON':'🔇 MIC OFF';}
function toggleCam(){camOn=!camOn;localStream.getVideoTracks().forEach(t=>t.enabled=camOn);document.getElementById('camBtn').innerText=camOn?'📷 CAM ON':'📷 CAM OFF';}
function activateOnce(){
  if(autoActive) return;
  autoActive=true;
  autoBtn.innerText='🔴 ESCUCHANDO... HABLA AHORA';
  autoBtn.className='w-full mt-2 bg-red-500 py-3 rounded-full text-xs font-black animate-pulse';
  startLiveTRI();
}
function startLiveTRI(){
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){subBox.innerText='Tu navegador no soporta voz, usa Chrome'; return;}
  recog=new SR();
  if(lang=='es') recog.lang='es-MX';
  if(lang=='en') recog.lang='en-US';
  if(lang=='zh') recog.lang='zh-CN';
  recog.continuous=true; recog.interimResults=false;
  recog.onstart=()=>{subBox.innerText='🟢 Te escucho en '+(lang=='es'?'ESPAÑOL':lang=='en'?'INGLES':'CHINO')+'... habla';};
  recog.onerror=(e)=>{subBox.innerText='Error mic: '+e.error+' - vuelve a picar el botón'; autoActive=false; autoBtn.innerText='🟢 PICA AQUÍ Y HABLA - 1 SOLO CLICK'; autoBtn.className='w-full mt-2 bg-green-500 py-3 rounded-full text-xs font-black';};
  recog.onresult=async (e)=>{
    let txt=e.results[e.results.length-1][0].transcript;
    subBox.innerText='Dijiste: '+txt+'\nTraduciendo...';
    let target = lang=='es'?'en':lang=='en'?'es':'es';
    let tr = await translateAuto(txt,target);
    subBox.innerText='TÚ: '+txt+'\nJCV: '+tr;
    let u=new SpeechSynthesisUtterance(tr);
    if(target=='es') u.lang='es-MX';
    if(target=='en') u.lang='en-US';
    if(target=='zh') u.lang='zh-CN';
    speechSynthesis.speak(u);
  };
  recog.onend=()=>{if(autoActive){try{recog.start();}catch(e){}}};
  recog.start();
}
init();
</script></body></html>
