<!DOCTYPE html><html lang="es"><head><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#2563eb"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JCV V2.3</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script></head><body class="bg-black flex justify-center p-2 min-h-screen">
<div class="w-full max-w-[390px]">
<div class="text-center mt-2"><span class="font-black text-blue-600 tracking-[5px] text-[24px]">JCV</span><span class="font-black tracking-[6px] text-[24px]"> TRADUCTOR</span><p id="estadoConn" class="text-[10px] text-zinc-400 mt-1">🔴 DESCONECTADO</p></div>

<div class="rounded-[18px] border-2 border-blue-600 h-[360px] mt-3 relative bg-zinc-900 overflow-hidden">
<video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
<video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover"></video>
<div id="overlay" class="absolute inset-0 bg-zinc-900/95 flex flex-col items-center justify-center gap-2 p-4"><button id="btnIniciar" class="bg-blue-600 rounded-full px-8 py-3 font-black text-[13px]">📷 INICIAR CÁMARA</button><p id="status" class="text-[10px] text-zinc-500 text-center">Usa WiFi para que no se trabe</p>
<div class="flex gap-2 mt-2"><span class="text-[10px]">Vol. local</span><input id="volLocal" type="range" min="0" max="100" value="80" class="w-20"><span class="text-[10px]">Vol. remoto</span><input id="volRemoto" type="range" min="0" max="100" value="100" class="w-20"></div>
</div>
</div>

<div class="mt-2 flex gap-2"><input id="myPhone" type="tel" placeholder="Tu celular" class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-2.5 text-[14px]"><button id="btnRegistrar" class="bg-blue-600 rounded-full px-4 text-[12px] font-black">OK</button></div>
<div class="mt-2 flex gap-2"><input id="peerPhone" type="tel" placeholder="Celular a llamar" class="flex-1 bg-black border border-green-600 rounded-full px-4 py-2.5 text-[14px]"><button id="btnLlamar" class="bg-green-600 rounded-full px-5 py-2.5 font-black text-[12px]">LLAMAR</button></div>

<div class="mt-2 flex gap-2"><select id="langSelect" class="flex-1 bg-black border border-zinc-700 rounded-full px-3 py-2.5 text-[13px]"><option value="zh-CN">🇨🇳 Chino</option><option value="en">🇺🇸 Inglés</option><option value="es">🇪🇸 Español</option><option value="pt">🇧🇷 Portugués</option></select>
<label class="flex items-center gap-1 bg-zinc-900 rounded-full px-3 text-[11px]"><input id="checkTradLlamada" type="checkbox" checked> Traducir en llamada</label></div>

<div class="mt-3 grid grid-cols-2 gap-2"><button id="btnEsMundo" class="bg-red-600 rounded-full py-3 text-[11px] font-black">ES → MUNDO ON</button><button id="btnMundoEs" class="bg-zinc-800 text-zinc-500 rounded-full py-3 text-[11px] font-black">MUNDO → ES OFF</button></div>

<button id="btnHablar" class="mt-3 w-full bg-blue-600 rounded-full py-4 font-black text-[13px]">🎙️ MANTÉN PRESIONADO PARA TRADUCIR</button>
<div class="mt-2 flex gap-2"><input id="textInput" placeholder="Escribe y traduce" class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-2.5 text-[13px]"><button id="btnEnviar" class="bg-yellow-400 text-black rounded-full px-5 font-black text-[12px]">Enviar</button></div>

<div class="mt-2 bg-zinc-900 rounded-xl p-2 min-h-[60px]"><p id="resultado" class="text-[13px] text-yellow-400">...</p><p id="resultado2" class="text-[11px] text-zinc-400 mt-1"></p></div>
<p class="text-center text-[10px] text-zinc-600 mt-2">7 días gratis - $10/mes o $90/año - Baja calidad a 480p para no trabarse</p>

<div id="modalPhone" class="fixed inset-0 bg-black z-[100] flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-700 rounded-2xl p-5 w-full max-w-[320px] text-center"><h2 class="font-black">Tu celular</h2><input id="firstPhone" type="tel" placeholder="55 1234 5678" class="w-full mt-3 bg-black border border-blue-600 rounded-full px-4 py-3 text-center"><button id="btnGuardarPrimero" class="mt-3 w-full bg-blue-600 rounded-full py-3 font-black">ENTRAR</button></div></div>
</div>

<script>
let direccion='es-mundo', peer=null, localStream=null, remoteStream=null, dataConn=null;
let btnEs=document.getElementById('btnEsMundo'), btnMundo=document.getElementById('btnMundoEs');
btnEs.onclick=()=>{ direccion='es-mundo'; btnEs.className='bg-red-600 rounded-full py-3 text-[11px] font-black'; btnMundo.className='bg-zinc-800 text-zinc-500 rounded-full py-3 text-[11px] font-black'; };
btnMundo.onclick=()=>{ direccion='mundo-es'; btnMundo.className='bg-blue-600 rounded-full py-3 text-[11px] font-black'; btnEs.className='bg-zinc-800 text-zinc-500 rounded-full py-3 text-[11px] font-black'; };

function limpiar(n){ return n.replace(/[^0-9]/g,''); }
function conectarPeer(num){
  peer = new Peer('jcv-'+num, {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' },
        { urls: 'turn:openrelay.metered.ca:80', username: 'openrelayproject', credential: 'openrelayproject' },
        { urls: 'turn:openrelay.metered.ca:443', username: 'openrelayproject', credential: 'openrelayproject' }
      ]
    }
  });
  peer.on('open', ()=>{ document.getElementById('estadoConn').innerText='🟢 EN LÍNEA '+num+' - Con WiFi va fluido'; });
  peer.on('connection', c=>{ dataConn=c; c.on('data', d=>{ document.getElementById('resultado').innerText='📩 '+d.original; document.getElementById('resultado2').innerText='Traducido: '+d.trad; if(document.getElementById('checkTradLlamada').checked){ hablar(d.trad); } }); });
  peer.on('call', async call=>{
    const s=await initMedia(); call.answer(s);
    call.on('stream', rs=>{ remoteStream=rs; let rv=document.getElementById('remoteVideo'); rv.srcObject=rs; rv.volume=document.getElementById('volRemoto').value/100; rv.classList.remove('hidden'); document.getElementById('estadoConn').innerText='🟢 EN LLAMADA'; });
  });
  peer.on('error', e=>{ if(e.type==='peer-unavailable'){ alert('El otro no está en línea. Que le de a INICIAR CÁMARA.'); } });
}
async function initMedia(){
  if(!localStream){
    localStream=await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 15, max: 20 } },
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    let lv=document.getElementById('localVideo'); lv.srcObject=localStream; lv.volume=document.getElementById('volLocal').value/100; document.getElementById('overlay').classList.add('hidden');
  } return localStream;
}
function guardarNumero(raw){ let num=limpiar(raw); if(num.length<10){ alert('10 dígitos'); return; } localStorage.setItem('jcv_phone',num); document.getElementById('myPhone').value=num; document.getElementById('modalPhone').classList.add('hidden'); conectarPeer(num); }
document.getElementById('btnGuardarPrimero').onclick=()=>guardarNumero(document.getElementById('firstPhone').value);
document.getElementById('btnRegistrar').onclick=()=>guardarNumero(document.getElementById('myPhone').value);
document.getElementById('btnIniciar').onclick=async()=>{ await initMedia(); let n=localStorage.getItem('jcv_phone'); if(n &&!peer) conectarPeer(n); };
document.getElementById('volRemoto').oninput=e=>{ let rv=document.getElementById('remoteVideo'); if(rv.srcObject) rv.volume=e.target.value/100; };
document.getElementById('volLocal').oninput=e=>{ let lv=document.getElementById('localVideo'); lv.volume=e.target.value/100; };

document.getElementById('btnLlamar').onclick=async()=>{
  let to=limpiar(document.getElementById('peerPhone').value); if(!to){ alert('Número'); return; }
  let me=localStorage.getItem('jcv_phone'); if(!me){ alert('Registra tu número'); return; }
  if(!localStream) await initMedia(); if(!peer) conectarPeer(me);
  await new Promise(r=>setTimeout(r,800));
  dataConn=peer.connect('jcv-'+to);
  let call=peer.call('jcv-'+to, localStream);
  call.on('stream', rs=>{ remoteStream=rs; let rv=document.getElementById('remoteVideo'); rv.srcObject=rs; rv.volume=document.getElementById('volRemoto').value/100; rv.classList.remove('hidden'); document.getElementById('estadoConn').innerText='🟢 CONECTADO CON '+to; });
};

document.getElementById('btnColgar').onclick=()=>{ if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; } document.getElementById('localVideo').srcObject=null; document.getElementById('remoteVideo').classList.add('hidden'); document.getElementById('overlay').classList.remove('hidden'); document.getElementById('estadoConn').innerText='🔴 COLGADO'; };

async function traducir(texto){
  let sl=direccion==='es-mundo'?'es':document.getElementById('langSelect').value.split('-')[0];
  let tl=direccion==='es-mundo'?document.getElementById('langSelect').value.split('-')[0]:'es';
  try{
    let url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(texto)}`;
    let r=await fetch(url); let d=await r.json(); return d[0].map(x=>x[0]).join('');
  }catch(e){
    try{ let r2=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(texto)}&langpair=${sl}|${tl}`); let d2=await r2.json(); return d2.responseData.translatedText; }catch(e2){ return texto; }
  }
}
function hablar(texto){ let lang=document.getElementById('langSelect').value; let voz=direccion==='es-mundo'?lang:'es-MX'; let u=new SpeechSynthesisUtterance(texto); u.lang=voz; u.volume=1; u.rate=0.9; speechSynthesis.speak(u); }

let rec=null; if(window.SpeechRecognition||window.webkitSpeechRecognition){ rec=new (window.SpeechRecognition||window.webkitSpeechRecognition)(); rec.interimResults=false; }
let btnHablar=document.getElementById('btnHablar');
if(rec){
  let start=()=>{ rec.lang=direccion==='es-mundo'?'es-MX':document.getElementById('langSelect').value; try{ rec.start(); btnHablar.innerText='🔴 ESCUCHANDO... SUELTA'; btnHablar.classList.add('bg-red-600'); }catch(e){} };
  let stop=()=>{ try{ rec.stop(); }catch(e){} btnHablar.innerText='🎙️ MANTÉN PRESIONADO PARA TRADUCIR'; btnHablar.classList.remove('bg-red-600'); };
  btnHablar.addEventListener('touchstart', e=>{ e.preventDefault(); start(); }); btnHablar.addEventListener('touchend', e=>{ e.preventDefault(); stop(); });
  btnHablar.addEventListener('mousedown', start); btnHablar.addEventListener('mouseup', stop);
  rec.onresult=async e=>{ let txt=e.results[0][0].transcript; document.getElementById('resultado').innerText='Dijiste: '+txt; let tr=await traducir(txt); document.getElementById('resultado').innerText=tr; document.getElementById('resultado2').innerText='Original: '+txt; hablar(tr); if(dataConn && dataConn.open){ dataConn.send({original:txt, trad:tr}); } };
  rec.onerror=e=>{ document.getElementById('resultado').innerText='Error micro: '+e.error; stop(); };
}
document.getElementById('btnEnviar').onclick=async()=>{ let t=document.getElementById('textInput').value.trim(); if(!t) return; let tr=await traducir(t); document.getElementById('resultado').innerText=tr; document.getElementById('resultado2').innerText='Original: '+t; hablar(tr); if(dataConn && dataConn.open){ dataConn.send({original:t, trad:tr}); } };

let saved=localStorage.getItem('jcv_phone'); if(saved){ document.getElementById('myPhone').value=saved; document.getElementById('firstPhone').value=saved; document.getElementById('modalPhone').classList.add('hidden'); conectarPeer(saved); }
</script></body></html>
