<!DOCTYPE html><html lang="es"><head><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#2563eb"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JCV V2.2</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>body{background:#000;color:#fff;font-family:system-ui}</style>
</head><body class="bg-black flex justify-center p-2 min-h-screen">
<div class="w-full max-w-[390px]">
<div class="text-center mt-2"><span class="font-black text-blue-600 tracking-[5px] text-[26px]">JCV</span><span class="font-black tracking-[6px] text-[26px]"> TRADUCTOR</span><p id="estadoConn" class="text-[10px] text-yellow-400 tracking-widest mt-1">🔴 DESCONECTADO - REGISTRA TU NUMERO</p></div>

<div class="rounded-[18px] border-2 border-blue-600 h-[360px] mt-3 relative bg-zinc-900 overflow-hidden">
<video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
<video id="remoteVideo" autoplay playsinline class="absolute inset-0 w-full h-full object-cover hidden"></video>
<div id="overlay" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-900/95 gap-2 p-4 text-center"><p class="text-[12px] text-zinc-300">Paso 1: Registra tu celular abajo</p><p class="text-[11px] text-zinc-500">Paso 2: Dale INICIAR CÁMARA</p><button id="btnIniciar" class="bg-blue-600 rounded-full px-8 py-4 font-black text-[14px] mt-2">📷 INICIAR CÁMARA Y MIC</button><p id="status" class="text-[11px] text-zinc-400 mt-2"></p></div>
</div>

<div class="mt-3 bg-zinc-900 border border-zinc-800 rounded-2xl p-3">
<p class="text-[10px] text-zinc-500 font-bold">TU CELULAR (TU USUARIO)</p>
<div class="flex gap-2 mt-1"><input id="myPhone" type="tel" placeholder="Ej: 55 1234 5678" class="w-full bg-black border border-zinc-700 rounded-full px-4 py-3 text-[15px] text-white"><button id="btnRegistrar" class="bg-blue-600 rounded-full px-5 font-black text-[12px]">GUARDAR</button></div>
</div>

<div class="mt-2 flex gap-2"><input id="peerPhone" type="tel" placeholder="Celular del otro" class="flex-1 bg-black border border-green-600 rounded-full px-4 py-3 text-[14px]"><button id="btnLlamar" class="bg-green-600 rounded-full px-5 py-3 font-black text-[13px]">📞 LLAMAR</button></div>

<div class="mt-2"><select id="langSelect" class="w-full bg-black border border-zinc-700 rounded-full px-4 py-3 text-[14px]"><option value="zh-CN">🇨🇳 Chino</option><option value="en">🇺🇸 Inglés</option><option value="es">🇪🇸 Español</option><option value="pt">🇧🇷 Portugués</option></select></div>

<div class="mt-3 grid grid-cols-2 gap-2">
<button id="btnEsMundo" class="bg-red-600 rounded-full py-3.5 text-[11px] font-black">🔴 ES → MUNDO ON</button>
<button id="btnMundoEs" class="bg-zinc-800 text-zinc-400 rounded-full py-3.5 text-[11px] font-black">MUNDO → ES OFF</button>
</div>

<button id="btnHablar" class="mt-3 w-full bg-blue-600 rounded-full py-4 font-black text-[13px]">🎙️ MANTÉN PRESIONADO Y HABLA</button>
<button id="btnColgar" class="mt-2 w-full border border-zinc-700 rounded-full py-3 font-bold text-[13px]">⏹️ COLGAR</button>

<div class="mt-3 flex gap-2"><input id="textInput" placeholder="Escribe aquí" class="flex-1 bg-black border border-zinc-700 rounded-full px-4 py-3 text-[14px]"><button id="btnEnviar" class="bg-yellow-400 text-black font-black rounded-full px-6 text-[13px]">ENVIAR</button></div>
<div class="mt-2 bg-zinc-900 rounded-xl p-3 min-h-[50px]"><p class="text-[10px] text-zinc-500">TRADUCCIÓN:</p><p id="resultado" class="text-[14px] text-yellow-400 mt-1">Aquí aparece lo traducido...</p></div>
<p id="trialText" class="text-center text-[11px] text-zinc-600 mt-2">7 días gratis - $10/mes o $90/año</p>

<div id="modalPhone" class="fixed inset-0 bg-black z-[100] flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-700 rounded-[24px] p-6 w-full max-w-[340px] text-center"><h2 class="font-black">Pon tu celular</h2><input id="firstPhone" type="tel" placeholder="55 1234 5678" class="w-full mt-4 bg-black border border-blue-600 rounded-full px-4 py-3 text-[18px] text-center"><button id="btnGuardarPrimero" class="mt-4 w-full bg-blue-600 rounded-full py-3.5 font-black">GUARDAR Y ENTRAR</button></div></div>
</div>

<script>
let direccion='es-mundo', peer=null, localStream=null;
let btnEs=document.getElementById('btnEsMundo'), btnMundo=document.getElementById('btnMundoEs');
btnEs.onclick=()=>{ direccion='es-mundo'; btnEs.className='bg-red-600 rounded-full py-3.5 text-[11px] font-black'; btnMundo.className='bg-zinc-800 text-zinc-400 rounded-full py-3.5 text-[11px] font-black'; btnEs.innerText='🔴 ES → MUNDO ON'; btnMundo.innerText='MUNDO → ES OFF'; }
btnMundo.onclick=()=>{ direccion='mundo-es'; btnMundo.className='bg-blue-600 rounded-full py-3.5 text-[11px] font-black'; btnEs.className='bg-zinc-800 text-zinc-400 rounded-full py-3.5 text-[11px] font-black'; btnMundo.innerText='🔵 MUNDO → ES ON'; btnEs.innerText='ES → MUNDO OFF'; }

function limpiar(n){ return n.replace(/[^0-9]/g,''); }
function conectarPeer(num){
  if(!num) return;
  const id='jcv-'+num;
  console.log('Conectando como',id);
  document.getElementById('estadoConn').innerText='🟡 CONECTANDO COMO '+num+'...';
  peer = new Peer(id, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' },{ urls: 'stun:stun1.l.google.com:19302' }] } });
  peer.on('open', ()=>{ document.getElementById('estadoConn').innerText='🟢 EN LÍNEA COMO '+num+' - LISTO PARA RECIBIR LLAMADAS'; document.getElementById('status').innerText='En línea. Ya puedes llamar.'; });
  peer.on('error', e=>{ console.log(e); document.getElementById('estadoConn').innerText='🔴 ERROR: '+e.type; if(e.type==='unavailable-id'){ alert('Ese número ya está en uso en otro celular. Cierra la app en el otro o usa otro número.'); } if(e.type==='peer-unavailable'){ alert('El número al que llamas no está en línea. Dile al otro que abra la app y le de a INICIAR CÁMARA.'); } });
  peer.on('call', async call=>{
    document.getElementById('estadoConn').innerText='📞 LLAMADA ENTRANTE DE '+call.peer.replace('jcv-','');
    const s=await initMedia(); call.answer(s);
    call.on('stream', rs=>{ let rv=document.getElementById('remoteVideo'); rv.srcObject=rs; rv.classList.remove('hidden'); });
  });
}
async function initMedia(){ if(!localStream){ try{ localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('localVideo').srcObject=localStream; document.getElementById('overlay').classList.add('hidden'); }catch(e){ alert('Debes permitir cámara y micro. Recarga la página.'); throw e; } } return localStream; }

function guardarNumero(raw){
  let num=limpiar(raw); if(num.length<10){ alert('Escribe 10 dígitos mínimo'); return; }
  localStorage.setItem('jcv_phone',num); document.getElementById('myPhone').value=num; document.getElementById('modalPhone').classList.add('hidden'); conectarPeer(num);
}
document.getElementById('btnGuardarPrimero').onclick=()=>guardarNumero(document.getElementById('firstPhone').value);
document.getElementById('btnRegistrar').onclick=()=>guardarNumero(document.getElementById('myPhone').value);
document.getElementById('btnIniciar').onclick=async()=>{ await initMedia(); let n=localStorage.getItem('jcv_phone'); if(n &&!peer) conectarPeer(n); };

document.getElementById('btnLlamar').onclick=async()=>{
  let to=limpiar(document.getElementById('peerPhone').value); if(!to){ alert('Pon el número del otro'); return; }
  let me=localStorage.getItem('jcv_phone'); if(!me){ alert('Primero registra tu número'); return; }
  if(!localStream){ await initMedia(); }
  if(!peer){ conectarPeer(me); await new Promise(r=>setTimeout(r,1500)); }
  document.getElementById('estadoConn').innerText='📞 LLAMANDO A '+to+'...';
  try{ let call=peer.call('jcv-'+to, localStream); call.on('stream', rs=>{ document.getElementById('remoteVideo').srcObject=rs; document.getElementById('remoteVideo').classList.remove('hidden'); document.getElementById('estadoConn').innerText='🟢 CONECTADO CON '+to; }); call.on('error',e=>{ alert('No se pudo conectar. El otro no está en línea.'); }); setTimeout(()=>{ if(document.getElementById('remoteVideo').srcObject==null){ alert('El número '+to+' no contesta o no está en la app. Asegúrate que el otro abrió la app y le dio a INICIAR CÁMARA.'); document.getElementById('estadoConn').innerText='🔴 SIN RESPUESTA DE '+to; } },5000); }catch(e){ alert('Error al llamar: '+e); }
};
document.getElementById('btnColgar').onclick=()=>{ if(localStream){ localStream.getTracks().forEach(t=>t.stop()); localStream=null; } document.getElementById('localVideo').srcObject=null; document.getElementById('remoteVideo').srcObject=null; document.getElementById('remoteVideo').classList.add('hidden'); document.getElementById('overlay').classList.remove('hidden'); document.getElementById('estadoConn').innerText='🔴 COLGADO'; };

// TRADUCCION QUE SI FUNCIONA - USA API LIBRE
async function traducir(texto){
  const lang=document.getElementById('langSelect').value;
  let sl= direccion==='es-mundo'?'es':lang.split('-')[0];
  let tl= direccion==='es-mundo'?lang:'es';
  try{
    const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sl}&tl=${tl}&dt=t&q=${encodeURIComponent(texto)}`;
    const res=await fetch(url); const data=await res.json(); return data[0][0][0];
  }catch(e){ console.log(e); return texto; }
}
function hablar(texto){
  const lang=document.getElementById('langSelect').value;
  let voz = direccion==='es-mundo'?lang:'es-MX';
  let u=new SpeechSynthesisUtterance(texto); u.lang=voz; speechSynthesis.speak(u);
}
// VOZ
let rec=null; if(window.webkitSpeechRecognition || window.SpeechRecognition){ rec=new (window.webkitSpeechRecognition||window.SpeechRecognition)(); rec.interimResults=false; }
let btnHablar=document.getElementById('btnHablar');
if(rec){
  btnHablar.addEventListener('touchstart', e=>{ e.preventDefault(); rec.lang=direccion==='es-mundo'?'es-MX':document.getElementById('langSelect').value; try{ rec.start(); btnHablar.innerText='🔴 ESCUCHANDO... SUELTA PARA TRADUCIR'; }catch(e){} });
  btnHablar.addEventListener('touchend', e=>{ e.preventDefault(); try{ rec.stop(); }catch(e){} btnHablar.innerText='🎙️ MANTÉN PRESIONADO Y HABLA'; });
  btnHablar.addEventListener('mousedown', ()=>{ rec.lang=direccion==='es-mundo'?'es-MX':document.getElementById('langSelect').value; try{ rec.start(); }catch(e){} btnHablar.innerText='🔴 ESCUCHANDO...'; });
  btnHablar.addEventListener('mouseup', ()=>{ try{ rec.stop(); }catch(e){} btnHablar.innerText='🎙️ MANTÉN PRESIONADO Y HABLA'; });
  rec.onresult=async e=>{ let txt=e.results[0][0].transcript; document.getElementById('resultado').innerText='Dijiste: '+txt+' (traduciendo...)'; let tr=await traducir(txt); document.getElementById('resultado').innerText=tr; hablar(tr); };
  rec.onerror=e=>{ document.getElementById('resultado').innerText='Error micro: '+e.error+' - permite microfono'; btnHablar.innerText='🎙️ MANTÉN PRESIONADO Y HABLA'; };
}else{ btnHablar.innerText='TU NAVEGADOR NO SOPORTA VOZ - USA CHROME'; }

document.getElementById('btnEnviar').onclick=async()=>{ let t=document.getElementById('textInput').value.trim(); if(!t) return; document.getElementById('resultado').innerText='Traduciendo...'; let tr=await traducir(t); document.getElementById('resultado').innerText=tr; hablar(tr); };

// AUTO LOGIN
let saved=localStorage.getItem('jcv_phone'); if(saved){ document.getElementById('myPhone').value=saved; document.getElementById('firstPhone').value=saved; document.getElementById('modalPhone').classList.add('hidden'); conectarPeer(saved); }
</script></body></html>
